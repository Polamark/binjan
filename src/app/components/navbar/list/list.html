<ul class="text-accent-font flex gap-10 text-2xl" [ngClass]="{
  'flex-col': this.vertical()
}">
  @for (item of listItems; track item) {

    <li>
      <a routerLink="/" [fragment]=item.toLowerCase() class="flex justify-center items-center w-fit gap-2 group active:scale-95 transition-all duration-200">
      <div class="relative h-10 w-5 overflow-hidden group-hover:scale-115 group-active:scale-100 transition-all duration-200"
           [ngClass]="{'scale-0': this.selected != item.toLowerCase()}">
        <div class="h-full absolute aspect-square border-2 border-selected rounded-full left-[100%] center-transform-x">
          &nbsp;
        </div>
      </div>
      <span class="group-hover:text-selected transition-colors duration-200"
         [ngClass]="{'text-selected': this.selected == item.toLowerCase()}">
        {{item.toUpperCase()}}
      </span>
      <div class="relative h-10 w-5 overflow-hidden group-hover:scale-115 group-active:scale-100 transition-all duration-200"
           [ngClass]="{'scale-0': this.selected != item.toLowerCase()}">
        <div class="h-full absolute aspect-square border-2 border-selected rounded-full center-transform-x">
          &nbsp;
        </div>
      </div>
    </a>
    </li>
  }
</ul>
