<section>
  <app-jumbotron id="jumbotron" class="bg-section-background text-default-font relative h-225 flex flex-col">
  </app-jumbotron>
  <app-help-section id="services" class="flex justify-center gap-10 items-center py-17.5">
  </app-help-section>
  <app-experience-section id="experience" class="bg-section-background text-default-font flex flex-col justify-center items-center py-17.5">
  </app-experience-section>
  <app-work-section id="works" class="text-default-font py-17.5 flex flex-col">

  </app-work-section>
  <app-notes-section id="notes" class="text-default-font py-17.5 flex flex-col bg-section-background">

  </app-notes-section>
  <article class="text-default-font pt-17.5 px-30 grid grid-cols-12 grid-rows-10">
    <article class="col-span-7 row-span-8 flex flex-col h-90 justify-between">
      <h2 class="text-7xl font-semibold">Let's make something amazing together</h2>
      <h2 class="text-7xl font-semibold flex">Start by
        <div class="w-fit ml-4">
          <a href="mailto:binjan10@gmail.com" class="text-orange-400 font-bold">saying hi</a>
          <div class="w-full h-0.5 bg-orange-200/75 -mt-1">&nbsp;</div>
        </div>
      </h2>
    </article>
    <article class="flex flex-col ml-25 col-span-5 row-span-8 gap-7">
      <h3 class="text-4xl font-medium">Information</h3>
      <span class="text-2xl text-accent-font">NY, USA</span>
      <app-list [vertical]="true" class="mt-10" />
    </article>
    <article class="flex flex-col justify-center items-center gap-4 col-span-12 row-span-2">
      <div class="w-full h-1 rounded-xl bg-accent-font/25">&nbsp;</div>
      <div class="w-full flex justify-between items-center">
        <div class="flex justify-center items-center gap-10">
          <h4 class="rouge-script text-4xl">Binjan</h4>
          <div class="w-1 h-7 bg-accent-font/25 rounded-2xl">&nbsp;</div>
          <span class="text-accent-font">&copy; 2025. All Rights Reserved</span>
        </div>
        <span class="text-accent-font">Design by <a class="text-selected font-semibold" target="_blank" href="https://dribbble.com/shots/16831903-Portfolio-Web-Site-Design-Landing-Page-Home-Page-UI">Orix Creative Agency</a>. Recreated by <a class="text-selected font-semibold" target="_blank" href="https://marekpolame.cz/">Marek Polame</a></span>
      </div>
    </article>
  </article>
</section>
